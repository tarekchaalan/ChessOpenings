<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f6f5f2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1c1b18">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;border:1px solid #e4e2dc">
      <tr>
        <td style="padding:28px">
          <p style="margin:0 0 4px;font-size:13px;color:#6b6860">Openings Trainer</p>
          <h1 style="margin:0 0 16px;font-size:20px">Confirm your new email</h1>
          <p style="margin:0 0 20px;font-size:15px;line-height:1.5">Confirm changing your sign-in email from {{ .Email }} to {{ .NewEmail }}.</p>
          <p style="margin:0 0 20px">
            <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email_change" style="display:inline-block;padding:10px 18px;border-radius:8px;background:#15781b;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px">Confirm change</a>
          </p>
          <p style="margin:0;font-size:12px;line-height:1.5;color:#6b6860">If you didn't ask for this change, ignore this email and change your password.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
